services:
  - type: web
    name: blue-swimming-crab-classifier
    env: python
    buildCommand: (git lfs pull || true) && pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: KERAS_BACKEND
        value: torch
